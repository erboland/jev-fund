name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  demo-gif:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write the demo recording
        if: hashFiles('docs/assets/demo.gif') == '' && hashFiles('docs/assets/demo.gif.ready') != ''
        run: |
          set -eu
          cat $(find docs/assets -name 'demo.gif.b64*' | sort) | base64 -d > docs/assets/demo.gif
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git rm -f docs/assets/demo.gif.b64*
          git add docs/assets/demo.gif
          git commit -m "Add the demo recording"
          git push origin HEAD:main

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Export static book
        run: npm run build:pages
        env:
          MODEL: jev
          # Set to fund.qinvesting.ai after DNS CNAME fund → erboland.github.io (see README).
          PAGES_CNAME: ${{ vars.PAGES_CNAME }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "/repos/${{ github.repository }}/pages" -f build_type=workflow \
            || gh api --method PUT "/repos/${{ github.repository }}/pages" -f build_type=workflow \
            || true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
