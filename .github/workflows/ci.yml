name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm test
      - run: npm run lint
