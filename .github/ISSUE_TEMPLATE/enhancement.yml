name: Enhancement
description: A focused improvement to the paper fund
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should change
      placeholder: Universe, sizer, Jev questions, dashboard…
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This does not add live brokerage or wallet hooks
          required: true
